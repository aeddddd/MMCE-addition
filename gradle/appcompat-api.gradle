// MMCE exposes legacy AE types in its public ABI. Pin the official compile API;
// no AppCompat classes are bundled into MMCE Addition.
def appcompatName = 'appcompat-1.0.1-dev.jar'
def appcompatHash = '5a99fa282d4dd58df74b443a255e0dfadc8407684f92bcd4b165781d5850a3a0'
def appcompatFile = layout.buildDirectory.file("dependencies/${appcompatName}")
def prepareAppcompat = tasks.register('prepareAppliedCompatibilityApi') {
    inputs.property 'sha256', appcompatHash
    outputs.file appcompatFile
    doLast {
        def target = appcompatFile.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists()) {
            def cached = file('../../.dev/appliedcompat/' + appcompatName)
            if (cached.exists()) java.nio.file.Files.copy(cached.toPath(), target.toPath())
            else {
                def connection = new URI('https://github.com/FormlessDragon/AppliedCompatibility/releases/download/v1.0.1/' + appcompatName).toURL().openConnection()
                connection.connectTimeout = 30000; connection.readTimeout = 120000
                connection.inputStream.withCloseable { input -> target.withOutputStream { output -> output << input } }
            }
        }
        if (java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString() != appcompatHash) {
            target.delete()
            throw new GradleException('AppliedCompatibility API checksum mismatch')
        }
    }
}
dependencies { compileOnly files(appcompatFile).builtBy(prepareAppcompat) }
