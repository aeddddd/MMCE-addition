plugins {
    id 'java-library'
    id 'com.cleanroommc.cleanroomgradle'
}
version = '1.4.4-ae2s.2'
group = 'com.github.aeddddd'
base.archivesName = 'MMCE-addition'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.blamejared.com' }
}
apply from: 'gradle/ae2-supergiant.gradle'
dependencies {
    implementation cleanroom.userdev(cleanroom_version)
    implementation(deobf('curse.maven:modularmachinery-community-edition-817377:7372951')) { transitive = false }
    compileOnly(deobf('curse.maven:geckolib-388172:4020277')) { transitive = false }
    compileOnly(deobf('curse.maven:the-one-probe-245211:2667280')) { transitive = false }
    compileOnly(deobf('curse.maven:thaumcraft-223628:2629023')) { transitive = false }
    compileOnly(deobf('curse.maven:botania-225643:3330934')) { transitive = false }
    compileOnly(deobf('curse.maven:astral-sorcery-241721:3044416')) { transitive = false }
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'zone.rong:mixinbooter:10.6'
    implementation 'it.unimi.dsi:fastutil:8.5.15'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}
configurations {
    testCompileOnly.extendsFrom compileOnly
    testRuntimeOnly.extendsFrom compileOnly
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '200']
}
tasks.withType(net.minecraftforge.renamer.gradle.RenameJar).configureEach {
    javaLauncher.set(javaToolchains.launcherFor { spec -> spec.languageVersion.set(JavaLanguageVersion.of(25)) })
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version, mcversion: '1.12.2' }
}
jar {
    manifest { attributes 'ModType': 'CRL', 'Implementation-Version': project.version }
    from 'LICENSE'
}
sourceSets {
    runtimeHarness {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('runtimeHarnessJar', Jar) {
    dependsOn tasks.runtimeHarnessClasses
    archiveFileName = 'mmce-addition-verification-mcp.jar'
    destinationDirectory = layout.buildDirectory.dir('verification')
    from sourceSets.runtimeHarness.output
}
extensions.getByType(net.minecraftforge.renamer.gradle.RenamerExtension).classes('reobfRuntimeHarnessJar', tasks.named('runtimeHarnessJar')) {
    map.from tasks.named('reobfJar').get().map
    libraries.setFrom(sourceSets.main.compileClasspath, tasks.named('jar'))
    output = layout.buildDirectory.file('verification/mmce-addition-verification-srg.jar')
}
apply from: 'gradle/cleanroom040-mixin.gradle'
