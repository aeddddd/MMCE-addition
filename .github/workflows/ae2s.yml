name: Native AE2S build

on:
  push:
    branches: [ae2s]
  pull_request:
    branches: [ae2s]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae2s-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Unit regressions and production jars
        run: ./gradlew test reobfJar reobfRuntimeHarnessJar --console=plain

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mmce-addition-ae2s-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/verification/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: build/reports/tests/test
          if-no-files-found: ignore
